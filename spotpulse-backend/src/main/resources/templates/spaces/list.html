<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>SpotPulse — Простори</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"/>
    <style>
        body { background: #f4f6fb; }
        .card-space { transition: transform .15s; border: none; border-radius: 1rem; overflow: hidden; }
        .card-space:hover { transform: translateY(-4px); box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.12); }
        .card-space img { height: 200px; object-fit: cover; }
        .placeholder-img {
            height: 200px; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #fff; font-size: 3rem;
        }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .space-search-panel { z-index: 1050; max-height: 24rem; overflow-y: auto; }
        .space-search-option { cursor: pointer; overflow-wrap: anywhere; }
        .space-search-option[aria-selected="true"] { background: #e8edff; outline: 2px solid #5368cd; outline-offset: -2px; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark hero">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/spaces">
            <i class="bi bi-geo-alt-fill me-2"></i>SpotPulse
        </a>
    </div>
</nav>

<!-- Header -->
<div class="container mt-4 mb-3 d-flex justify-content-between align-items-center">
    <h1 class="h3 fw-bold mb-0">
        <i class="bi bi-building me-2 text-primary"></i>Коворкінг-простори
    </h1>
    <a th:href="@{/spaces/new}" class="btn btn-primary">
        <i class="bi bi-plus-lg me-1"></i>Додати
    </a>
</div>

<div class="container mb-4">
    <div id="space-search" class="position-relative" th:attr="data-url=@{/api/spaces/autocomplete},data-detail-url=@{/spaces/}">
        <label for="space-search-input" class="form-label fw-semibold">Пошук коворкінгу</label>
        <input id="space-search-input" type="search" class="form-control form-control-lg"
               maxlength="100" autocomplete="off" role="combobox" aria-autocomplete="list"
               aria-expanded="false" aria-controls="space-search-results" aria-haspopup="listbox"
               aria-describedby="space-search-help" placeholder="Назва або місто"/>
        <div id="space-search-panel" class="space-search-panel position-absolute top-100 start-0 w-100 bg-white border rounded shadow" hidden>
            <ul id="space-search-results" role="listbox" aria-label="Коворкінги" class="list-unstyled mb-0"></ul>
            <p id="space-search-status" role="status" aria-live="polite" class="small text-muted m-0 p-3"></p>
        </div>
    </div>
    <p id="space-search-help" class="form-text">Введіть щонайменше 3 літери або цифри. Оберіть результат стрілками та натисніть Enter.</p>
    <noscript><p class="text-muted">Увімкніть JavaScript для швидкого пошуку. Простори також доступні нижче.</p></noscript>
</div>

<!-- Cards -->
<div class="container">
    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(spaces)}" class="text-center py-5 text-muted">
        <i class="bi bi-inbox" style="font-size:3rem;"></i>
        <p class="mt-2">Поки що немає жодного простору. Натисніть «Додати», щоб створити перший!</p>
    </div>

    <div class="row g-4" th:unless="${#lists.isEmpty(spaces)}">
        <div class="col-sm-6 col-lg-4 col-xl-3" th:each="space : ${spaces}">
            <div class="card card-space shadow-sm h-100">
                <!-- Image (C1 — відображення файлу-посилання imageUrl) -->
                <img th:if="${space.imageUrl != null and !space.imageUrl.isBlank()}"
                     th:src="${space.imageUrl}"
                     th:alt="${space.name}"
                     class="card-img-top"/>
                <div th:unless="${space.imageUrl != null and !space.imageUrl.isBlank()}"
                     class="placeholder-img">
                    <i class="bi bi-image"></i>
                </div>

                <div class="card-body d-flex flex-column">
                    <h2 class="h5 card-title fw-semibold">
                        <a class="text-decoration-none" th:href="@{/spaces/{id}(id=${space.id})}" th:text="${space.name}">Space</a>
                    </h2>
                    <p class="card-text text-muted small flex-grow-1"
                       th:text="${#strings.abbreviate(space.description, 100)}">Description</p>
                    <p class="mb-1 small">
                        <i class="bi bi-geo-alt text-danger me-1"></i>
                        <span th:text="${space.address}">Address</span>
                    </p>
                    <p class="mb-2 small">
                        <i class="bi bi-pin-map text-primary me-1"></i>
                        <span th:text="${space.city}">City</span>
                    </p>
                    <a th:href="@{/spaces/{id}(id=${space.id})}" class="btn btn-primary mb-3"
                       th:attr="aria-label=${'Докладніше про ' + space.name}">Докладніше</a>
                    <div class="d-flex gap-2 mt-auto">
                        <a th:href="@{'/spaces/' + ${space.id} + '/edit'}"
                           class="btn btn-sm btn-outline-primary flex-fill">
                            <i class="bi bi-pencil me-1"></i>Редагувати
                        </a>
                        <form th:action="@{'/spaces/' + ${space.id} + '/delete'}" method="post" class="flex-fill">
                            <button type="submit" class="btn btn-sm btn-outline-danger w-100"
                                    onclick="return confirm('Видалити цей простір?')">
                                <i class="bi bi-trash me-1"></i>Видалити
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script th:src="@{/js/space-autocomplete.js}" src="/js/space-autocomplete.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
