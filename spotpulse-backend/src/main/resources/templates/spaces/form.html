<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${isEdit} ? 'Редагувати простір — SpotPulse' : 'Новий простір — SpotPulse'">
        Форма — SpotPulse
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet"/>
    <style>
        body { background: #f4f6fb; }
        .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .form-card { border: none; border-radius: 1rem; }
        .preview-img { max-height: 200px; object-fit: cover; border-radius: .5rem; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark hero">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/spaces">
            <i class="bi bi-geo-alt-fill me-2"></i>SpotPulse
        </a>
    </div>
</nav>

<div class="container mt-4" style="max-width: 640px;">
    <h1 class="h4 fw-bold mb-3">
        <i class="bi me-2" th:classappend="${isEdit} ? 'bi-pencil-square' : 'bi-plus-circle'"></i>
        <span th:text="${isEdit} ? 'Редагувати простір' : 'Створити новий простір'">Form</span>
    </h1>

    <div class="card form-card shadow-sm">
        <div class="card-body p-4">
            <form th:action="${isEdit} ? @{'/spaces/' + ${space.id}} : @{/spaces}"
                  method="post" th:object="${space}">

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Назва *</label>
                    <input type="text" class="form-control" id="name"
                           th:field="*{name}" required placeholder="Creative Hub Kyiv"/>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Опис</label>
                    <textarea class="form-control" id="description" rows="3"
                              th:field="*{description}"
                              placeholder="Сучасний коворкінг із панорамними вікнами…"></textarea>
                </div>

                <!-- Address -->
                <div class="mb-3">
                    <label for="address" class="form-label fw-semibold">Адреса *</label>
                    <input type="text" class="form-control" id="address"
                           th:field="*{address}" required placeholder="вул. Хрещатик, 22"/>
                </div>

                <!-- City -->
                <div class="mb-3">
                    <label for="city" class="form-label fw-semibold">Місто *</label>
                    <input type="text" class="form-control" id="city"
                           th:field="*{city}" required placeholder="Київ"/>
                </div>

                <!-- Image URL (C1 — поле типу файл/посилання) -->
                <div class="mb-3">
                    <label for="imageUrl" class="form-label fw-semibold">
                        <i class="bi bi-image me-1"></i>URL зображення
                    </label>
                    <input type="url" class="form-control" id="imageUrl"
                           th:field="*{imageUrl}"
                           placeholder="https://example.com/photo.jpg"
                           oninput="updatePreview(this.value)"/>
                    <div class="form-text">Вставте посилання на зображення простору</div>
                </div>

                <!-- Image preview -->
                <div class="mb-3 text-center" id="previewBlock" style="display:none;">
                    <img id="previewImg" class="preview-img w-100" alt="Preview"/>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi me-1" th:classappend="${isEdit} ? 'bi-save' : 'bi-plus-lg'"></i>
                        <span th:text="${isEdit} ? 'Зберегти' : 'Створити'">Submit</span>
                    </button>
                    <a href="/spaces" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg me-1"></i>Скасувати
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function updatePreview(url) {
        const block = document.getElementById('previewBlock');
        const img = document.getElementById('previewImg');
        if (url && url.startsWith('http')) {
            img.src = url;
            block.style.display = 'block';
            img.onerror = function() { block.style.display = 'none'; };
        } else {
            block.style.display = 'none';
        }
    }
    // Show preview on page load if imageUrl already set
    document.addEventListener('DOMContentLoaded', function() {
        const urlInput = document.getElementById('imageUrl');
        if (urlInput && urlInput.value) updatePreview(urlInput.value);
    });
</script>
</body>
</html>
