spring.application.name=spotpulse
spring.profiles.default=local

# B9: local public-read caches; maximum entries applies separately to each cache.
spotpulse.cache.enabled=${SPOTPULSE_CACHE_ENABLED:true}
spotpulse.cache.ttl=${SPOTPULSE_CACHE_TTL:120s}
spotpulse.cache.maximum-size=${SPOTPULSE_CACHE_MAXIMUM_SIZE:500}

# ─── Local development database ───
# Local URL is resolved to an absolute external path by LocalDatabaseEnvironment.
# Explicit spring.datasource.url / SPRING_DATASOURCE_URL always takes precedence.
# Driver and Hibernate dialect are inferred from that URL (H2 or PostgreSQL).
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA / Hibernate ───
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ─── H2 Console ───
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Set the public origin (and optional context path) after deployment, without a trailing slash.
spotpulse.seo.public-base-url=${SPOTPULSE_PUBLIC_BASE_URL:}
# Local/staging pages remain noindex unless a public base URL is configured and indexing enabled.
spotpulse.seo.indexable=${SPOTPULSE_SEO_INDEXABLE:true}

# Credentials are read only by the backend from the launching process environment.
spotpulse.auth.frontend-origin=${SPOTPULSE_FRONTEND_ORIGIN:http://localhost:5173}
spotpulse.auth.redirect-uri=${SPOTPULSE_OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SPOTPULSE_SESSION_SECURE:false}
server.servlet.session.timeout=30m
